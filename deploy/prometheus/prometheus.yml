# Сбор метрик портала «Машук».
#
# Всё крутится внутри docker-сети: наружу ничего не публикуется, доступ к
# Prometheus — только через Grafana. Ретенция 15 дней задана в compose.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: mashuk-online

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Хост: CPU, память, диск, сеть, файловые системы
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # PostgreSQL: соединения, размер базы, транзакции
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Ответы Caddy по классам (2xx/3xx/4xx/5xx) из access-лога
  - job_name: caddy
    static_configs:
      - targets: ["caddy-exporter:9180"]

  # Доступность портала снаружи: /api/health через HTTPS
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "https://mashuk.online/api/health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
